services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: knowledgebridge
      MYSQL_USER: kbuser
      MYSQL_PASSWORD: kbpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports: ["3307:3306"]
    volumes: ["kb_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: knowledgebridge
      DB_USER: kbuser
      DB_PASSWORD: kbpassword
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  kb_mysql:
